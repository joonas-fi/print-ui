<!DOCTYPE html>
<html>
<head>
	<title>Print</title>
</head>
<body>
	<h1>Print</h1>

	<form enctype="multipart/form-data" action="/upload" method="post">
		<fieldset>
			<legend>PDF file</legend>
			<input type="file" name="uploadedFile" />
		</fieldset>
		<fieldset>
			<legend>Options</legend>
			Copies:
			<input type="text" name="copies" value="1" />
			<label>
				<input type="checkbox" name="double-sided" value="y" />
				Double sided
			</label>
		</fieldset>
		<input type="submit" value="Print" />
	</form>
</body>
</html>
