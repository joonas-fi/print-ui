<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Print Desk</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #d9ddd7; color: #16201a; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: clamp(1rem, 5vw, 4rem) 1rem; display: grid; place-items: center; background: radial-gradient(circle at top left, #f9b76a, transparent 28rem), #d9ddd7; }
    main { width: min(42rem, 100%); border: 1px solid #16201a; border-radius: 1.25rem; background: #fcfbf4; box-shadow: .65rem .65rem 0 #16201a; }
    header { padding: clamp(1.4rem, 5vw, 2.6rem); border-radius: 1.2rem 1.2rem 0 0; background: #16201a; color: #fcfbf4; }
    .eyebrow { margin: 0 0 .5rem; color: #f9b76a; font-family: ui-monospace, monospace; font-size: .8rem; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); line-height: .9; letter-spacing: -.08em; }
    .mode-nav { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .mode-nav a { border: 1px solid #c9d0c7; border-radius: 99rem; color: #fcfbf4; padding: .4rem .75rem; text-decoration: none; font-size: .85rem; font-weight: 750; }
    .mode-nav a:hover, .mode-nav a.active { border-color: #f9b76a; background: #f9b76a; color: #16201a; }
    form { padding: clamp(1.2rem, 4vw, 2rem); display: grid; gap: 1.25rem; }
    label, legend { font-weight: 750; }
    label span { display: block; margin-bottom: .45rem; }
    input, select { width: 100%; min-height: 3rem; border: 1px solid #16201a; border-radius: .65rem; background: #fff; color: inherit; font: inherit; padding: .7rem; }
    input:focus, select:focus { outline: 3px solid #f9b76a; outline-offset: 2px; }
    fieldset { margin: 0; border: 1px solid #16201a; border-radius: .65rem; padding: 1rem; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
    .options { display: flex; flex-wrap: wrap; gap: .8rem 1.25rem; }
    .options label { display: flex; align-items: center; gap: .55rem; }
    .options input { width: 1.2rem; min-height: 1.2rem; accent-color: #e15b36; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button { width: 100%; border: 0; border-radius: .65rem; background: #e15b36; color: white; cursor: pointer; font: 800 1rem Inter, ui-sans-serif, sans-serif; padding: 1rem; }
    button:hover { background: #bd4224; }
    .secondary { border: 1px solid #16201a; background: #fff; color: #16201a; }
    .secondary:hover { background: #f9b76a; }
    .message, .preview { margin: 0 1.2rem 1.2rem; border-radius: .65rem; padding: 1rem; font-weight: 650; }
    .notice { background: #ccebd4; }
    .error { background: #ffd8cf; }
    .preview { border: 1px solid #16201a; overflow-x: auto; background: #fff; }
    .preview h2 { margin: 0 0 .75rem; font-size: 1rem; }
    .preview img { display: block; max-width: none; height: 128px; image-rendering: pixelated; }
    @media (max-width: 34rem) { .row, .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">BROTHER P-TOUCH / LABEL MODE</p><h1>Print Desk</h1><nav class="mode-nav" aria-label="Printer mode"><a href="/printers">Receipt</a><a href="/printers/pdf">PDF</a><a class="active" href="/printers/labels">Labels</a><a href="/printers/codes">Codes</a></nav></header>
    <form method="post" action="/printers/labels/print">
      <div class="row"><label><span>Unique labels</span><input name="unique-labels" type="number" min="1" value="{{.Values.UniqueLabels}}" required></label><label><span>Copies of each</span><input name="copies" type="number" min="1" value="{{.Values.Copies}}" required></label></div>
      <label><span>Reprint existing ID (optional)</span><input name="reprint" value="{{.Values.Reprint}}" autocomplete="off"></label>
      <fieldset><legend>Barcode type</legend><div class="options"><label><input name="barcode-kind" type="radio" value="qr" {{if eq .Values.BarcodeKind "qr"}}checked{{end}}>QR</label><label><input name="barcode-kind" type="radio" value="datamatrix" {{if eq .Values.BarcodeKind "datamatrix"}}checked{{end}}>Data Matrix</label><label><input name="barcode-kind" type="radio" value="code128" {{if eq .Values.BarcodeKind "code128"}}checked{{end}}>Code 128</label></div></fieldset>
      <fieldset><legend>Content and output</legend><div class="options"><label><input name="barcodes" type="checkbox" {{if .Values.Barcodes}}checked{{end}}>Barcode</label><label><input name="texts" type="checkbox" {{if .Values.Texts}}checked{{end}}>Text</label><label><input name="feed" type="checkbox" {{if .Values.Feed}}checked{{end}}>Feed final label</label></div></fieldset>
      <div class="actions"><button class="secondary" type="submit" formaction="/printers/labels/preview">Preview</button><button type="submit">Print labels</button></div>
    </form>
    {{if .PreviewPNG}}<section class="preview"><h2>Label preview</h2><img src="{{.PreviewPNG}}" alt="Label preview"></section>{{end}}
    {{if .Notice}}<div class="message notice">{{.Notice}}</div>{{end}}
    {{if .Error}}<div class="message error">{{.Error}}</div>{{end}}
  </main>
</body>
</html>
